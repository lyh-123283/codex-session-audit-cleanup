name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/session_cleanup.py tests/test_session_cleanup.py
      - run: python scripts/session_cleanup.py --help
      - run: python scripts/session_cleanup.py backups --help
